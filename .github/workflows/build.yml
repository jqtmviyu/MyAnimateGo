name: 多架构构建与发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 构建并发布的已有标签
        required: true
        default: '0.1'
        type: string
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 准备前端
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: 确认发布版本
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 构建前端并收集许可
        run: bash scripts/prepare-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: webui-assets
          path: |
            backend/internal/webui/dist/
            backend/internal/webui/licenses/
          if-no-files-found: error
          retention-days: 3

  build:
    name: 编译 ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: windows-arm64
            goos: windows
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm || '' }}
      MYANIMEGO_OUTPUT_DIR: ${{ github.workspace }}/dist/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: webui-assets
          path: backend/internal/webui
      - name: 编译内嵌前端的程序
        run: bash scripts/build-backend.sh
      - name: 打包程序与许可证
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/package-release.py \
            --source "$MYANIMEGO_OUTPUT_DIR" \
            --target "$BUILD_TARGET" \
            --version "$RELEASE_TAG" \
            --output packages
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: 发布 Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: 确认标签仍对应当前构建
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$SOURCE_SHA" ]]; then
            printf '标签已移动，请使用新提交重新构建。\n' >&2
            exit 1
          fi
      - name: 生成校验文件
        run: |
          (cd packages && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: 发布或更新同版本附件
        run: |
          cat > .release-notes.md <<'NOTES'
          前端已内嵌到可执行文件，解压后即可启动，无需单独部署 web 目录。

          - Linux：amd64、arm64、armv7。
          - Windows：amd64、arm64。
          - macOS：Intel（amd64）、Apple Silicon（arm64）。
          - 每个压缩包包含程序、README、项目与依赖许可证，SHA256SUMS 用于校验。
          - macOS 发布包为命令行版本，不包含原生系统托盘。

          升级前停止服务并备份，替换程序后继续使用原有 data 目录。
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "MyAnimeGo $RELEASE_TAG" --notes-file .release-notes.md
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "MyAnimeGo $RELEASE_TAG" --notes-file .release-notes.md
